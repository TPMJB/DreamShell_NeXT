name: CRC read-back diagnostic build

on:
  push:
    branches:
      - codex/readback-diagnostics
  workflow_dispatch:

concurrency:
  group: dreamshell-crc-diagnostic-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build and publish CRC diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GIT_TERMINAL_PROMPT: "0"
      REQUIRE_EXFAT_TESTS: "1"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean || true
          df -hT

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk patch bzip2 tar make cmake pkg-config \
            gettext wget bison flex sed meson ninja-build \
            build-essential diffutils curl python3 rake zlib1g-dev exfatprogs dosfstools \
            genisoimage squashfs-tools texinfo git zip \
            libgmp-dev libmpfr-dev libmpc-dev libelf-dev libisofs-dev \
            libpng-dev libjpeg-dev liblzo2-dev liblua5.2-dev lua5.2

      - name: Install tolua
        run: |
          git clone --depth 1 https://github.com/LuaDist/tolua.git /tmp/tolua
          cmake -S /tmp/tolua -B /tmp/tolua/build
          make -C /tmp/tolua/build -j"$(nproc)"
          sudo make -C /tmp/tolua/build install

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test storage interoperability and GD Ripper
        run: python3 -m unittest discover -s utils/tests -v

      - name: Prepare directories
        run: |
          sudo mkdir -p /usr/local/dc/kos /opt/toolchains/dc
          sudo chown -R "$(id -u):$(id -g)" /usr/local/dc /opt/toolchains

      - name: Resolve kos-ports SHA
        id: ports
        run: echo "sha=$(git ls-remote https://github.com/KallistiOS/kos-ports.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v5
        with:
          path: /opt/toolchains/dc
          key: dc-toolchain-${{ runner.os }}-${{ hashFiles('sdk/toolchain/Makefile.cfg', 'sdk/toolchain/patches/*.diff', 'sdk/doc/KallistiOS.txt') }}

      - name: Restore kos-ports cache
        id: cache-ports
        uses: actions/cache/restore@v5
        with:
          path: /usr/local/dc/kos/kos-ports
          key: kos-ports-${{ runner.os }}-${{ steps.ports.outputs.sha }}-${{ hashFiles('sdk/doc/KallistiOS.txt', 'sdk/toolchain/Makefile.cfg') }}

      - name: Clone kos-ports
        if: steps.cache-ports.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none \
            https://github.com/KallistiOS/kos-ports.git /usr/local/dc/kos/kos-ports

      - name: Prepare KallistiOS tree
        run: bash .github/scripts/dev-build.sh prepare

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/dev-build.sh toolchain

      - name: Verify toolchain
        run: test -x /opt/toolchains/dc/sh-elf/bin/sh-elf-gcc

      - name: Check ISO Loader SH-4 builds
        run: bash .github/scripts/dev-build.sh loaders

      - name: Save toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/toolchains/dc
          key: dc-toolchain-${{ runner.os }}-${{ hashFiles('sdk/toolchain/Makefile.cfg', 'sdk/toolchain/patches/*.diff', 'sdk/doc/KallistiOS.txt') }}

      - name: Build KallistiOS
        run: bash .github/scripts/dev-build.sh kos

      - name: Build kos-ports
        run: bash .github/scripts/dev-build.sh ports

      - name: Save kos-ports cache
        if: steps.cache-ports.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /usr/local/dc/kos/kos-ports
          key: kos-ports-${{ runner.os }}-${{ steps.ports.outputs.sha }}-${{ hashFiles('sdk/doc/KallistiOS.txt', 'sdk/toolchain/Makefile.cfg') }}

      - name: Build DreamShell release
        run: bash .github/scripts/dev-build.sh release

      - name: Package GD Ripper diagnostic update
        run: |
          python3 - <<'PY_PACKAGE'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('DreamShell-dev.zip') as full:
              assert full.testzip() is None, 'Release ZIP is damaged'
              prefix = 'DS/apps/gd_ripper/'
              required = {prefix + p for p in ('app.xml', 'modules/app_gd_ripper.klf', 'redump.db', 'tosec.db')}
              assert required <= set(full.namelist()), 'GD Ripper files missing'
              assert b'version="2.1.1"' in full.read(prefix + 'app.xml')
              with ZipFile('DreamShell-crc-diagnostic-update.zip', 'w', ZIP_DEFLATED) as update:
                  for name in full.namelist():
                      if name.startswith(prefix):
                          update.writestr(name, full.read(name))
                  update.write('utils/README.readback-diagnostic.md', 'readback-guide.md')
          PY_PACKAGE

      - name: Publish CRC diagnostic prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            GD Ripper 2.1.1 saved-read diagnostic for the CC11/CC22 console/PC CRC discrepancy.
            Captures suspect bytes, compares two reopen/rereads, and checks for buffer changes.
            This is instrumentation, not a confirmed fix for the underlying read/memory fault.
            Merge the update's DS folder; keep the current core, boot disc and launcher.
            Scan the small CC22 and CC11 copies; preserve each folder's diagnostic files.
            See readback-guide.md inside the ZIP. No track data is rewritten by a scan.

            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh release view crc-diagnostic >/dev/null 2>&1; then
            gh release delete crc-diagnostic --yes --cleanup-tag
          fi
          gh release create crc-diagnostic DreamShell-crc-diagnostic-update.zip \
            --title "DreamShell GD Ripper Read-back Diagnostic" \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES"
