name: Full K-UI release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release
        type: boolean
        required: true
        default: false

concurrency:
  group: dreamshell-next-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build complete K-UI package
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GIT_TERMINAL_PROMPT: "0"
      REQUIRE_EXFAT_TESTS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read release version
        id: release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            test "$GITHUB_REF" = refs/heads/master || { echo 'Publish from the reviewed master branch.'; exit 1; }
            existing="$(git ls-remote --tags origin "refs/tags/k-ui-${version}")"
            test -z "$existing" || { echo 'Release tag already exists; refusing to overwrite it.'; exit 1; }
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean || true
          df -hT

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk patch bzip2 tar make cmake pkg-config \
            gettext wget bison flex sed meson ninja-build \
            build-essential diffutils curl python3 rake zlib1g-dev exfatprogs dosfstools \
            genisoimage squashfs-tools texinfo git zip \
            libgmp-dev libmpfr-dev libmpc-dev libelf-dev libisofs-dev \
            libpng-dev libjpeg-dev liblzo2-dev liblua5.2-dev lua5.2 python3-pil

      - name: Install tolua
        run: |
          git clone --depth 1 https://github.com/LuaDist/tolua.git /tmp/tolua
          cmake -S /tmp/tolua -B /tmp/tolua/build
          make -C /tmp/tolua/build -j"$(nproc)"
          sudo make -C /tmp/tolua/build install

      - name: Test storage interoperability and GD Ripper
        run: python3 -m unittest discover -s utils/tests -v

      - name: Check TV-safe app previews
        run: |
          python3 utils/preview_maintenance_apps.py /tmp/maintenance-preview
          python3 utils/preview_utility_apps.py /tmp/utility-preview
          python3 utils/preview_bootloader.py /tmp/bootloader-preview

      - name: Prepare directories
        run: |
          sudo mkdir -p /usr/local/dc/kos /opt/toolchains/dc
          sudo chown -R "$(id -u):$(id -g)" /usr/local/dc /opt/toolchains

      - name: Resolve kos-ports SHA
        id: ports
        run: echo "sha=$(git ls-remote https://github.com/KallistiOS/kos-ports.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v5
        with:
          path: /opt/toolchains/dc
          key: dc-toolchain-${{ runner.os }}-${{ hashFiles('sdk/toolchain/Makefile.cfg', 'sdk/toolchain/patches/*.diff', 'sdk/doc/KallistiOS.txt') }}

      - name: Restore kos-ports cache
        id: cache-ports
        uses: actions/cache/restore@v5
        with:
          path: /usr/local/dc/kos/kos-ports
          key: kos-ports-${{ runner.os }}-${{ steps.ports.outputs.sha }}-${{ hashFiles('sdk/doc/KallistiOS.txt', 'sdk/toolchain/Makefile.cfg') }}

      - name: Clone kos-ports
        if: steps.cache-ports.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none \
            https://github.com/KallistiOS/kos-ports.git /usr/local/dc/kos/kos-ports

      - name: Prepare KallistiOS tree
        run: bash .github/scripts/dev-build.sh prepare

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/dev-build.sh toolchain

      - name: Verify toolchain
        run: test -x /opt/toolchains/dc/sh-elf/bin/sh-elf-gcc

      - name: Check utility apps SH-4 compilation
        run: |
          source /usr/local/dc/kos/kos/environ.sh
          make -C applications/settings/modules module.o exports.o
          make -C applications/gdplay/modules module.o exec.o exports.o
          make -C applications/filemanager/modules module.o exports.o
          make -C applications/bios_flasher/modules module.o exports.o
          make -C applications/region_changer/modules module.o exports.o
          make -C applications/speedtest/modules module.o exports.o
          make -C applications/memtest/modules module.o exports.o
          make -C applications/network/modules module.o exports.o
          make -C applications/gd_ripper/modules module.o music.o exports.o
          make -C applications/vmu_manager/modules module.o exports.o
          make -C applications/iso_loader/modules module.o utils.o exports.o
          make -C applications/games_menu/modules module.o utils.o menu.o system_menu.o preset.o exports.o
          make -C applications/launch_app/modules module.o items.o scene.o manage.o music.o exports.o
          make -C modules/isoldr module.o preset.o elf.o exports.o
          make -C modules/isofs gdi.o

      - name: Check ISO Loader SH-4 builds
        run: bash .github/scripts/dev-build.sh loaders

      - name: Save toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/toolchains/dc
          key: dc-toolchain-${{ runner.os }}-${{ hashFiles('sdk/toolchain/Makefile.cfg', 'sdk/toolchain/patches/*.diff', 'sdk/doc/KallistiOS.txt') }}

      - name: Build KallistiOS
        run: bash .github/scripts/dev-build.sh kos

      - name: Build kos-ports
        run: bash .github/scripts/dev-build.sh ports

      - name: Save kos-ports cache
        if: steps.cache-ports.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /usr/local/dc/kos/kos-ports
          key: kos-ports-${{ runner.os }}-${{ steps.ports.outputs.sha }}-${{ hashFiles('sdk/doc/KallistiOS.txt', 'sdk/toolchain/Makefile.cfg') }}

      - name: Build complete DreamShell bundle
        run: bash .github/scripts/dev-build.sh release

      - name: Validate and seal complete build
        run: |
          python3 utils/package_release.py
          python3 - <<'PY_BUILD'
          from pathlib import Path
          from zipfile import ZipFile
          version = Path('VERSION').read_text().strip()
          with ZipFile(f'K-UI-v{version}.zip') as package:
              assert package.testzip() is None
              package.extractall('full-build')
          PY_BUILD

      - name: Validate music runtime imports
        run: |
          source /usr/local/dc/kos/kos/environ.sh
          python3 utils/package_menu_music.py check-imports "$KOS_BASE" "$KOS_CC_BASE/bin/sh-elf-nm"

      - name: Upload complete build contents
        uses: actions/upload-artifact@v4
        with:
          name: K-UI-v${{ steps.release.outputs.version }}
          path: full-build/
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          current="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$current" = "$GITHUB_SHA" || { echo 'Source branch changed during the build; refusing to publish stale files.'; exit 1; }
          existing="$(git ls-remote --tags origin "refs/tags/k-ui-${version}")"
          test -z "$existing" || { echo 'Release tag already exists; refusing to overwrite it.'; exit 1; }
          cp RELEASE-NOTES.md /tmp/next-release-notes.md
          printf '\nBuilt from [%s](%s/%s/commit/%s). [Build and test results](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/next-release-notes.md
          # Upload assets as a draft first; publish only once both uploads finish.
          gh release create "k-ui-$version" "K-UI-v${version}.zip" SHA256SUMS \
            --draft --title "K-UI ${version} — by TPMJB" \
            --target "$GITHUB_SHA" --notes-file /tmp/next-release-notes.md
          gh release edit "k-ui-$version" --draft=false --latest
