name: Launcher preview build

on:
  push:
    branches:
      - codex/launcher-ui
  workflow_dispatch:

concurrency:
  group: dreamshell-launcher-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build and publish launcher preview
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GIT_TERMINAL_PROMPT: "0"
      REQUIRE_EXFAT_TESTS: "1"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean || true
          df -hT

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk patch bzip2 tar make cmake pkg-config \
            gettext wget bison flex sed meson ninja-build \
            build-essential diffutils curl python3 rake zlib1g-dev exfatprogs dosfstools \
            genisoimage squashfs-tools texinfo git zip \
            libgmp-dev libmpfr-dev libmpc-dev libelf-dev libisofs-dev \
            libpng-dev libjpeg-dev liblzo2-dev liblua5.2-dev lua5.2

      - name: Install tolua
        run: |
          git clone --depth 1 https://github.com/LuaDist/tolua.git /tmp/tolua
          cmake -S /tmp/tolua -B /tmp/tolua/build
          make -C /tmp/tolua/build -j"$(nproc)"
          sudo make -C /tmp/tolua/build install

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test launcher, storage and GD Ripper
        run: python3 -m unittest discover -s utils/tests -v

      - name: Prepare directories
        run: |
          sudo mkdir -p /usr/local/dc/kos /opt/toolchains/dc
          sudo chown -R "$(id -u):$(id -g)" /usr/local/dc /opt/toolchains

      - name: Resolve kos-ports SHA
        id: ports
        run: echo "sha=$(git ls-remote https://github.com/KallistiOS/kos-ports.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v5
        with:
          path: /opt/toolchains/dc
          key: dc-toolchain-${{ runner.os }}-${{ hashFiles('sdk/toolchain/Makefile.cfg', 'sdk/toolchain/patches/*.diff', 'sdk/doc/KallistiOS.txt') }}

      - name: Restore kos-ports cache
        id: cache-ports
        uses: actions/cache/restore@v5
        with:
          path: /usr/local/dc/kos/kos-ports
          key: kos-ports-${{ runner.os }}-${{ steps.ports.outputs.sha }}-${{ hashFiles('sdk/doc/KallistiOS.txt', 'sdk/toolchain/Makefile.cfg') }}

      - name: Clone kos-ports
        if: steps.cache-ports.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none \
            https://github.com/KallistiOS/kos-ports.git /usr/local/dc/kos/kos-ports

      - name: Prepare KallistiOS tree
        run: bash .github/scripts/dev-build.sh prepare

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/dev-build.sh toolchain

      - name: Verify toolchain
        run: test -x /opt/toolchains/dc/sh-elf/bin/sh-elf-gcc

      - name: Check launcher SH-4 compilation
        run: |
          source /usr/local/dc/kos/kos/environ.sh
          make -C applications/launch_app/modules module.o items.o scene.o manage.o exports.o

      - name: Check ISO Loader SH-4 builds
        run: bash .github/scripts/dev-build.sh loaders

      - name: Save toolchain cache
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/toolchains/dc
          key: dc-toolchain-${{ runner.os }}-${{ hashFiles('sdk/toolchain/Makefile.cfg', 'sdk/toolchain/patches/*.diff', 'sdk/doc/KallistiOS.txt') }}

      - name: Build KallistiOS
        run: bash .github/scripts/dev-build.sh kos

      - name: Build kos-ports
        run: bash .github/scripts/dev-build.sh ports

      - name: Save kos-ports cache
        if: steps.cache-ports.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /usr/local/dc/kos/kos-ports
          key: kos-ports-${{ runner.os }}-${{ steps.ports.outputs.sha }}-${{ hashFiles('sdk/doc/KallistiOS.txt', 'sdk/toolchain/Makefile.cfg') }}

      - name: Build DreamShell release
        run: bash .github/scripts/dev-build.sh release

      - name: Package launcher update
        run: |
          python3 - <<'PY_PACKAGE'
          from pathlib import Path
          from shutil import copyfile
          from zipfile import ZipFile, ZIP_DEFLATED
          copyfile('DreamShell-dev.zip', 'DreamShell-launcher.zip')
          copyfile('utils/README.launcher.md', 'launcher-guide.md')
          copyfile('utils/launcher-preview.png', 'launcher-preview.png')
          with ZipFile('DreamShell-launcher.zip', 'a', ZIP_DEFLATED) as full:
              full.write('launcher-guide.md')
              full.write('launcher-preview.png')
          required = {
              'DS/DS_CORE.BIN',
              'DS/apps/launch_app/app.xml',
              'DS/apps/launch_app/catalog.xml',
              'DS/apps/launch_app/modules/app_launch_app.klf',
              'DS/fonts/txf/helvetica.txf',
          }
          with ZipFile('DreamShell-launcher.zip') as full:
              assert full.testzip() is None, 'Release ZIP is damaged'
              assert required <= set(full.namelist()), 'Launcher files missing'
              with ZipFile('DreamShell-launcher-update.zip', 'w', ZIP_DEFLATED) as update:
                  for name in full.namelist():
                      if name.startswith('DS/apps/launch_app/') or name in ('DS/fonts/txf/helvetica.txf', 'DS/DS_CORE.BIN'):
                          update.writestr(name, full.read(name))
                  update.write('launcher-guide.md')
          PY_PACKAGE

      - name: Publish launcher prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Launcher 2.0 preview: app list, descriptions, static artwork and direct controller navigation.
            Based on the current exFAT preview; includes a core export needed for safe texture cleanup.
            Filesystem, bootloader, ISO Loader and GD Ripper behavior are unchanged.

            Already running the exFAT preview? Use DreamShell-launcher-update.zip and merge its DS folder.
            No new boot disc is needed for that update. See launcher-guide.md for controls and console checks.
            DreamShell-launcher.zip is the complete release. This preview still needs console validation.

            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh release view launcher >/dev/null 2>&1; then
            gh release delete launcher --yes --cleanup-tag
          fi
          gh release create launcher DreamShell-launcher.zip DreamShell-launcher-update.zip launcher-guide.md launcher-preview.png \
            --title "DreamShell NeXT Launcher Preview" \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES"
