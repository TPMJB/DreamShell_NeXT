name: K-UI host checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      REQUIRE_EXFAT_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 python3-pil exfatprogs dosfstools
      - name: Run regression and storage interoperability checks
        run: python3 -m unittest discover -s utils/tests -v
      - name: Render TV-safe utility previews
        run: |
          python3 utils/preview_maintenance_apps.py /tmp/maintenance-preview
          python3 utils/preview_utility_apps.py /tmp/utility-preview
          python3 utils/preview_bootloader.py /tmp/bootloader-preview
