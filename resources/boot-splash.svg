<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <title>DreamShell NeXT by TPMJB</title>
  <desc>640 by 480 boot artwork inside a power-of-two Dreamcast texture.</desc>
  <defs>
    <linearGradient id="night" x2="0.8" y2="1">
      <stop stop-color="#080e21"/><stop offset="1" stop-color="#112348"/>
    </linearGradient>
    <linearGradient id="cyan" x2="1" y2="0.8">
      <stop stop-color="#69fff1"/><stop offset="1" stop-color="#309fff"/>
    </linearGradient>
    <clipPath id="screen"><path d="M0 0h640v480H0z"/></clipPath>
  </defs>
  <path fill="#080e21" d="M0 0h1024v512H0z"/>
  <g clip-path="url(#screen)">
    <path fill="url(#night)" d="M0 0h640v480H0z"/>
    <g fill="none" stroke="#214062" stroke-width="1.5">
      <path d="M-160 455 275 20h555M-125 490 310 55h555M-90 525 345 90h555"/>
    </g>
    <path fill="#0e1c38" d="m0 365 240 115H0zm640-250L415 0h225z"/>
    <path fill="url(#cyan)" d="M286 148V92h13l42 42V92h13v56h-13l-42-42v42z"/>
    <path fill="#80fff0" d="M286 158h68v3h-68z"/>
    <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
      <text x="320" y="227" font-size="38" fill="#f3f7ff" letter-spacing="0.5">DreamShell</text>
      <text x="320" y="299" font-size="76" font-weight="bold" fill="url(#cyan)" letter-spacing="1">NeXT</text>
      <text x="320" y="347" font-size="21" fill="#ceddef">by TPMJB</text>
      <text x="320" y="421" font-size="14" fill="#93afcb" letter-spacing="1">Your Dreamcast. Your tools.</text>
    </g>
  </g>
</svg>
